name: Deploy to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Build Diagnostics and Deploy
        id: deploy_all
        run: |
          mkdir -p run_logs
          LOG_FILE="run_logs/latest_deploy.txt"

          echo "=== 1. Vercel Pull ===" > "$LOG_FILE"
          npx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN" >> "$LOG_FILE" 2>&1

          echo "" >> "$LOG_FILE"
          echo "=== 2. Vercel Build ===" >> "$LOG_FILE"
          npx vercel@latest build --prod --token="$VERCEL_TOKEN" >> "$LOG_FILE" 2>&1

          echo "" >> "$LOG_FILE"
          echo "=== 3. Inspecting .vercel/output ===" >> "$LOG_FILE"
          find .vercel/output -maxdepth 3 >> "$LOG_FILE" 2>&1 || true

          if [ -f .vercel/output/config.json ]; then
            echo "" >> "$LOG_FILE"
            echo "=== 4. .vercel/output/config.json ===" >> "$LOG_FILE"
            cat .vercel/output/config.json >> "$LOG_FILE" 2>&1
          fi

          echo "" >> "$LOG_FILE"
          echo "=== 5. Vercel Deploy ===" >> "$LOG_FILE"
          DEPLOY_OUTPUT=$(npx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN" 2>&1)
          echo "$DEPLOY_OUTPUT" >> "$LOG_FILE"

          DEPLOY_URL=$(echo "$DEPLOY_OUTPUT" | grep -o 'https://[^ ]*\.vercel\.app' | head -n 1)
          echo "DEPLOY_URL: $DEPLOY_URL" >> "$LOG_FILE"

          echo "" >> "$LOG_FILE"
          echo "=== 6. Setting Aliases ===" >> "$LOG_FILE"
          if [ -n "$DEPLOY_URL" ]; then
            npx vercel@latest alias set "$DEPLOY_URL" quanlydachucnang.vercel.app --token="$VERCEL_TOKEN" >> "$LOG_FILE" 2>&1 || true
            npx vercel@latest alias set "$DEPLOY_URL" link-portal-vy-8173.vercel.app --token="$VERCEL_TOKEN" >> "$LOG_FILE" 2>&1 || true
          fi

          echo "" >> "$LOG_FILE"
          echo "=== 7. Connectivity Tests ===" >> "$LOG_FILE"
          if [ -n "$DEPLOY_URL" ]; then
            echo "--- Test DEPLOY_URL ($DEPLOY_URL) ---" >> "$LOG_FILE"
            curl -ILs "$DEPLOY_URL" | head -n 20 >> "$LOG_FILE" 2>&1 || true
            echo "--- Content of DEPLOY_URL ---" >> "$LOG_FILE"
            curl -s "$DEPLOY_URL" | head -n 15 >> "$LOG_FILE" 2>&1 || true
          fi
          echo "--- Test quanlydachucnang.vercel.app ---" >> "$LOG_FILE"
          curl -ILs "https://quanlydachucnang.vercel.app" | head -n 20 >> "$LOG_FILE" 2>&1 || true

      - name: Commit and push deployment diagnostic logs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add run_logs/latest_deploy.txt
          git commit -m "chore(ci): capture build output tree and config [skip ci]" || true
          git push origin main || true